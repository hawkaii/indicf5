version: '3.8'

services:
  # FastAPI HTTP API Server
  api:
    build: .
    container_name: indicf5-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: python3 api.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Socket Server for Streaming TTS
  socket-server:
    build: .
    container_name: indicf5-socket-server
    ports:
      - "9998:9998"
    environment:
      - PYTHONUNBUFFERED=1
    command: python3 socket_server.py --host 0.0.0.0 --port 9998
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9998"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
