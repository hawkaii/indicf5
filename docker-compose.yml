version: '3.8'

services:

  # Socket Server for Streaming TTS
  socket-server:
    build: .
    container_name: indicf5-socket-server
    ports:
      - "9998:9998"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}

    command: python3 socket_server.py --host 0.0.0.0 --port 9998
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9998"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
