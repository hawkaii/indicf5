version: '3.8'

services:

  # Socket Server for Streaming TTS
  socket-server:
    build: .
    container_name: indicf5-socket-server
    ports:
      - "9998:9998"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
    
    # Enable GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    command: python3 socket_server.py --host 0.0.0.0 --port 9998 --device cuda
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',9998)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
